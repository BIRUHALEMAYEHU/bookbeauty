services:
  db:
    image: postgres:18
    # A small init process as PID 1 cleans up finished health checks. Without
    # it Postgres adopts them, and a check that times out on a busy machine
    # makes Postgres restart and drop every connection mid-test.
    init: true
    environment:
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book
      POSTGRES_DB: book
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d book"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
